<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<style>
  :root {
    --sky: #c9dce8;
    --sky-deep: #9fbdd0;
    --ink: #1c2a35;
    --paper: #fbfaf5;
    --green: #2f5d50;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sky: #1b2a36;
      --sky-deep: #243746;
      --ink: #e8eef2;
      --paper: #2b3d4b;
      --green: #8cc7b3;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 100%);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    text-align: center;
  }
  main { max-width: 34rem; }
  .sheet {
    width: 150px;
    height: auto;
    transform: rotate(-4deg);
    filter: drop-shadow(0 14px 12px rgba(0, 0, 0, 0.18));
    animation: drift 6s ease-in-out infinite;
  }
  .sheet .page { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
  .sheet .fold { fill: var(--sky-deep); stroke: var(--ink); stroke-width: 2; }
  .sheet .scribble { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; fill: none; opacity: 0.55; }
  @keyframes drift {
    0%, 100% { transform: rotate(-4deg) translateY(0); }
    50% { transform: rotate(-2deg) translateY(-10px); }
  }
  h1 {
    margin: 18px 0 4px;
    font-size: clamp(4.5rem, 20vw, 8rem);
    line-height: 1;
    font-weight: 400;
    letter-spacing: -0.04em;
  }
  .quote {
    margin: 0 0 20px;
    font-size: clamp(1.4rem, 5vw, 2rem);
    font-style: italic;
    color: var(--green);
  }
  p { margin: 0 auto 28px; max-width: 28rem; font-size: 1.05rem; line-height: 1.6; }
  a {
    display: inline-block;
    padding: 12px 26px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    color: var(--ink);
    font-family: inherit;
    font-size: 1rem;
    text-decoration: none;
    transition: background 0.2s, color 0.2s;
  }
  a:hover, a:focus-visible { background: var(--ink); color: var(--sky); outline: none; }
  a:focus-visible { box-shadow: 0 0 0 4px var(--green); }
  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none; }
    a { transition: none; }
  }
</style>
</head>
<body>
<main>
  <svg class="sheet" viewBox="0 0 150 190" role="img" aria-label="A blank sheet of paper with a folded corner">
    <path class="page" d="M10 8 H105 L142 45 V182 H10 Z"/>
    <path class="fold" d="M105 8 V45 H142 Z"/>
    <path class="scribble" d="M30 80 q10 -8 20 0 t20 0 t20 0"/>
    <path class="scribble" d="M30 108 q10 -8 20 0 t20 0"/>
    <path class="scribble" d="M30 136 q10 -8 20 0 t20 0 t20 0 t10 0"/>
  </svg>
  <h1>404</h1>
  <p class="quote">Ceci n'est pas une page.</p>
  <p>The address you asked for does not lead anywhere. It may have moved, or it may never have existed. Either way, there is nothing to read here.</p>
  <a href="/">Back to the home page</a>
</main>
</body>
</html>
